<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap | View Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #020611;
      --bg-2: #07183c;
      --panel: rgba(9, 21, 48, 0.78);
      --panel-2: rgba(7, 16, 38, 0.88);
      --text: #e9efff;
      --muted: #9eb0d8;
      --gold: #f8cd4c;
      --border: rgba(129, 166, 250, 0.32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, #0b255e 0%, transparent 36%),
        radial-gradient(circle at 88% 16%, #082252 0%, transparent 38%),
        linear-gradient(150deg, var(--bg-1), var(--bg-2));
    }

    .container {
      width: min(1050px, 94%);
      margin: 1rem auto;
      display: grid;
      gap: 0.9rem;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(170deg, var(--panel), var(--panel-2));
      padding: 1rem;
      backdrop-filter: blur(12px);
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.52rem 0.92rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      color: #eaf0ff;
      background: rgba(104, 146, 252, 0.14);
    }

    .btn-gold {
      color: #091530;
      background: linear-gradient(135deg, #ffe484, #ffc71d);
      border-color: rgba(248, 205, 76, 0.55);
    }

    .header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.8rem;
      align-items: center;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(128, 164, 252, 0.75);
    }

    .name { margin: 0; font-weight: 800; font-size: 1.2rem; }
    .meta { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.9rem; }
    .rating { color: #ffd76d; font-weight: 700; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
    }

    .item {
      border: 1px solid rgba(129, 166, 250, 0.3);
      border-radius: 12px;
      background: rgba(8, 18, 41, 0.86);
      padding: 0.75rem;
    }

    .item h3 {
      margin: 0 0 0.45rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffe7a0;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }

    .chip {
      border-radius: 999px;
      border: 1px solid rgba(129, 166, 250, 0.4);
      background: rgba(129, 166, 250, 0.16);
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
    }

    .links { display: flex; flex-wrap: wrap; gap: 0.5rem; }

    .chat-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: min(420px, 100%);
      height: 100vh;
      background: #062451;
      border-left: 1px solid rgba(129, 166, 250, 0.35);
      transition: right 0.28s ease;
      z-index: 30;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .chat-drawer.open { right: 0; }

    .chat-head {
      padding: 0.8rem;
      border-bottom: 1px solid rgba(129, 166, 250, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-body {
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
      overflow-y: auto;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px),
        radial-gradient(circle at 76% 62%, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px),
        radial-gradient(circle at 30% 78%, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px),
        linear-gradient(160deg, rgba(24, 39, 86, 0.35), rgba(8, 27, 62, 0.2));
      background-size: 80px 80px, 95px 95px, 110px 110px, auto;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 0.35rem;
      width: 100%;
      position: relative;
      min-height: 30px;
      overflow: visible;
      animation: popIn 0.22s ease both;
    }

    .msg-row.me {
      justify-content: flex-end;
    }

    .msg-row.them {
      justify-content: flex-start;
    }

    .msg-time {
      opacity: 0;
      transform: translateX(14px);
      white-space: nowrap;
      font-size: 0.68rem;
      color: #eaf4ff;
      position: absolute;
      right: 10px;
      bottom: 6px;
      z-index: 3;
      background: rgba(15, 35, 82, 0.72);
      border: 1px solid rgba(138, 172, 245, 0.35);
      border-radius: 999px;
      padding: 0.12rem 0.42rem;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }

    .msg-row.reveal .msg-time {
      opacity: 0.9;
      transform: translateX(0);
    }

    .bubble {
      display: inline-flex;
      width: fit-content;
      max-width: min(72%, 280px);
      border-radius: 20px;
      padding: 0.22rem 0.55rem;
      line-height: 1.18;
      font-size: 0.88rem;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: grab;
      user-select: none;
      touch-action: pan-y;
      transform: translateX(0);
      transition: transform 0.12s ease;
      position: relative;
      z-index: 1;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.14);
    }

    .bubble > div {
      display: inline;
      width: fit-content;
    }

    .bubble.me {
      background: #76d2db;
      color: #062744;
      border: 1px solid #7de0ea;
    }

    .bubble.them {
      background: #76d2db;
      color: #062744;
      border: 1px solid #7de0ea;
    }

    .chat-input {
      padding: 0.75rem;
      border-top: 1px solid rgba(129, 166, 250, 0.3);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
    }

    .chat-input input {
      border-radius: 10px;
      border: 1px solid rgba(129, 166, 250, 0.4);
      background: #f7f6e5;
      color: #12223e;
      padding: 0.55rem 0.65rem;
      font: inherit;
    }

    .chat-input input::placeholder {
      color: #6d6b63;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .header { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="panel top">
      <a href="dash.html" class="btn">Back To Dashboard</a>
      <button id="chatBtn" class="btn btn-gold" type="button">Start Chat</button>
    </section>

    <section class="panel">
      <div class="header">
        <img id="profilePhoto" class="avatar" alt="Profile photo" />
        <div>
          <h1 id="profileName" class="name">Profile</h1>
          <p id="profileMeta" class="meta"></p>
          <p id="profileLoc" class="meta"></p>
        </div>
        <div id="profileRating" class="rating"></div>
      </div>
    </section>

    <section class="grid">
      <article class="item">
        <h3>Bio</h3>
        <p id="profileBio" class="meta"></p>
      </article>

      <article class="item">
        <h3>Availability</h3>
        <p id="profileAvailability" class="meta"></p>
      </article>

      <article class="item">
        <h3>Skills They Teach</h3>
        <div id="teachSkills" class="chips"></div>
      </article>

      <article class="item">
        <h3>Skills They Want to Learn</h3>
        <div id="learnSkills" class="chips"></div>
      </article>

      <article class="item" style="grid-column: 1 / -1;">
        <h3>Certificates / Portfolio Links</h3>
        <div id="profileLinks" class="links"></div>
      </article>
    </section>
  </div>

  <aside id="chatDrawer" class="chat-drawer">
    <div class="chat-head">
      <strong id="chatTitle">Chat</strong>
      <button id="closeChat" class="btn" type="button">Close</button>
    </div>
    <div id="chatBody" class="chat-body"></div>
    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="Type your message..." />
      <button id="sendBtn" class="btn btn-gold" type="button">Send</button>
    </div>
  </aside>

  <script>
    const users = [
      { id: 201, name: "Aarav Mehta", photo: "https://i.pravatar.cc/120?img=12", profession: "Frontend Mentor", teaches: ["React", "JavaScript", "UI Design"], wants: ["Public Speaking", "Data Viz"], branch: "Computer Science Engineering", yearStudy: "3rd Year", location: "Mumbai", availability: "Weekdays 7 PM - 10 PM", bio: "Frontend enthusiast focused on clean architecture and practical mentoring.", rating: 4.9, links: [{ label: "React Certificate", url: "https://example.com/react-certificate.pdf" }, { label: "GitHub Portfolio", url: "https://github.com/" }] },
      { id: 202, name: "Riya Nair", photo: "https://i.pravatar.cc/120?img=32", profession: "ML Enthusiast", teaches: ["Python", "Data Structures", "Machine Learning"], wants: ["UI Design", "Cloud Basics"], branch: "Artificial Intelligence and Data Science", yearStudy: "4th Year", location: "Bangalore", availability: "Mon-Fri 6 PM - 9 PM", bio: "Builds ML mini-products and teaches strong problem-solving skills.", rating: 4.8, links: [{ label: "ML Certificate", url: "https://example.com/ml-certificate.pdf" }, { label: "Drive Portfolio", url: "https://drive.google.com/" }] },
      { id: 203, name: "Karan Verma", photo: "https://i.pravatar.cc/120?img=21", profession: "Core Mechanical Tutor", teaches: ["CAD", "Thermodynamics", "MATLAB"], wants: ["Web Development", "English Fluency"], branch: "Mechanical Engineering", yearStudy: "3rd Year", location: "Pune", availability: "Sat-Sun 11 AM - 4 PM", bio: "Mechanical engineer helping students with core and simulation topics.", rating: 4.6, links: [{ label: "MATLAB Badge", url: "https://example.com/matlab-badge.pdf" }] },
      { id: 204, name: "Sneha Iyer", photo: "https://i.pravatar.cc/120?img=5", profession: "DSA Coach", teaches: ["C++", "Operating Systems", "DSA"], wants: ["System Design", "UI/UX"], branch: "Information Technology", yearStudy: "2nd Year", location: "Chennai", availability: "Daily 8 PM - 10 PM", bio: "Focused on coding interview preparation and CS fundamentals.", rating: 4.7, links: [{ label: "DSA Repo", url: "https://github.com/" }] },
      { id: 205, name: "Aditya Rao", photo: "https://i.pravatar.cc/120?img=18", profession: "Embedded Systems Mentor", teaches: ["Circuit Design", "VLSI", "Embedded C"], wants: ["Python Automation", "Tech Writing"], branch: "Electronics and Communication Engineering", yearStudy: "4th Year", location: "Hyderabad", availability: "Weekdays 5 PM - 8 PM", bio: "Works on hardware prototyping and practical embedded workflows.", rating: 4.5, links: [{ label: "Embedded Certificate", url: "https://example.com/embedded-certificate.pdf" }] },
      { id: 206, name: "Isha Kapoor", photo: "https://i.pravatar.cc/120?img=28", profession: "Full-Stack Learner", teaches: ["Web Development", "Node.js", "GitHub"], wants: ["Data Structures", "Machine Learning"], branch: "Computer Science Engineering", yearStudy: "1st Year", location: "Delhi", availability: "Weekends 1 PM - 5 PM", bio: "Shares practical project patterns and deployment basics.", rating: 4.4, links: [{ label: "Node Project Repo", url: "https://github.com/" }] }
    ];

    let currentUser = null;
    try {
      currentUser = JSON.parse(localStorage.getItem("skillswap_current_user") || "null");
    } catch {
      currentUser = null;
    }

    if (!currentUser || !currentUser.username) {
      window.location.href = "index.html";
    }

    const params = new URLSearchParams(window.location.search);
    const idFromQuery = params.get("user") || "";

    let selected = users.find((u) => u.id === Number(idFromQuery));
    if (!selected) {
      try {
        const stored = JSON.parse(localStorage.getItem("skillswap_selected_profile") || "null");
        if (stored && stored.id) selected = users.find((u) => u.id === stored.id) || stored;
      } catch {
        selected = null;
      }
    }

    if (!selected) {
      window.location.href = "dash.html";
    }

    document.getElementById("profilePhoto").src = selected.photo;
    document.getElementById("profileName").textContent = selected.name;
    document.getElementById("profileMeta").textContent = `${selected.profession} | ${selected.branch} | ${selected.yearStudy}`;
    document.getElementById("profileLoc").textContent = selected.location;
    document.getElementById("profileBio").textContent = selected.bio;
    document.getElementById("profileAvailability").textContent = selected.availability;
    document.getElementById("profileRating").textContent = `★★★★★ ${selected.rating}`;

    document.getElementById("teachSkills").innerHTML = (selected.teaches || []).map((skill) => `<span class="chip">${skill}</span>`).join("");
    document.getElementById("learnSkills").innerHTML = (selected.wants || []).map((skill) => `<span class="chip">${skill}</span>`).join("");
    document.getElementById("profileLinks").innerHTML = (selected.links || []).map((item) => `<a class="btn btn-outline" target="_blank" rel="noopener" href="${item.url}">${item.label}</a>`).join("");

    const drawer = document.getElementById("chatDrawer");
    const chatBody = document.getElementById("chatBody");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatTitle = document.getElementById("chatTitle");

    chatTitle.textContent = `Chat with ${selected.name}`;

    const chatKey = `skillswap_chat_${currentUser.username.toLowerCase()}_${selected.id}`;

    function getMessages() {
      try {
        return JSON.parse(localStorage.getItem(chatKey) || "[]");
      } catch {
        return [];
      }
    }

    function setMessages(messages) {
      localStorage.setItem(chatKey, JSON.stringify(messages));
    }

    function renderMessages() {
      const messages = getMessages();
      if (!messages.length) {
        chatBody.innerHTML = '<p style="color:#9eb0d8;font-size:0.85rem;">No messages yet. Say hello.</p>';
        return;
      }

      chatBody.innerHTML = messages.map((m, idx) => `
        <div class="msg-row ${m.sender === "me" ? "me" : "them"}" style="animation-delay:${Math.min(idx * 0.03, 0.25)}s;">
          <div class="msg-time">${m.time}</div>
          <div class="bubble ${m.sender === "me" ? "me" : "them"}">
            <div>${m.text}</div>
          </div>
        </div>
      `).join("");
      attachSwipeHandlers();
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function attachSwipeHandlers() {
      const rows = chatBody.querySelectorAll(".msg-row");
      rows.forEach((row) => {
        const bubble = row.querySelector(".bubble");
        let startX = 0;
        let currentX = 0;
        let dragging = false;

        const onDown = (x) => {
          dragging = true;
          startX = x;
          bubble.style.transition = "none";
        };

        const onMove = (x) => {
          if (!dragging) return;
          currentX = x - startX;
          const shift = Math.max(-98, Math.min(0, currentX));
          bubble.style.transform = `translateX(${shift}px)`;
          row.classList.toggle("reveal", shift < -30);
        };

        const onUp = () => {
          if (!dragging) return;
          dragging = false;
          bubble.style.transition = "transform 0.12s ease";
          const shouldReveal = currentX < -30;
          bubble.style.transform = shouldReveal ? "translateX(-72px)" : "translateX(0)";
          row.classList.toggle("reveal", shouldReveal);
          currentX = 0;
        };

        bubble.addEventListener("mousedown", (e) => onDown(e.clientX));
        window.addEventListener("mousemove", (e) => onMove(e.clientX));
        window.addEventListener("mouseup", onUp);

        bubble.addEventListener("touchstart", (e) => onDown(e.touches[0].clientX), { passive: true });
        bubble.addEventListener("touchmove", (e) => onMove(e.touches[0].clientX), { passive: true });
        bubble.addEventListener("touchend", onUp);
      });
    }

    function sendMessage() {
      const text = chatInput.value.replace(/\s+/g, " ").trim();
      if (!text) return;
      const messages = getMessages();
      messages.push({
        sender: "me",
        text,
        time: new Date().toLocaleString()
      });
      setMessages(messages);
      chatInput.value = "";
      renderMessages();
    }

    document.getElementById("chatBtn").addEventListener("click", () => {
      drawer.classList.add("open");
      renderMessages();
      chatInput.focus();
    });

    document.getElementById("closeChat").addEventListener("click", () => {
      drawer.classList.remove("open");
    });

    sendBtn.addEventListener("click", sendMessage);
    chatInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
