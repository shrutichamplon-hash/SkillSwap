idebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400" data-nav="analytics"> <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Analytics </button> <button onclick="navigateTo('logs')" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400" data-nav="logs"> <i data-lucide="scroll-text" class="w-4 h-4"></i> Activity Logs </button>

       </div>
       <div class="relative"><button onclick="toggleNotifPanel()" class="p-2 bg-slate-800 rounded-lg border border-slate-700 hover:border-slate-600 text-slate-400 hover:text-white transition-colors relative"> <i data-lucide="bell" class="w-4 h-4"></i> <span id="notif-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[10px] rounded-full flex items-center justify-center hidden">0</span> </button>

  <script>
// ========== STATE ==========
let appState = {
  loggedIn: false,
  currentPage: 'overview',
  adminEmail: '',
  adminRole: 'super_admin',
  otpCode: '',
  darkMode: true,
  allData: [],
  backendMode: false,
  charts: {}
};

const API_BASE = "http://localhost:4000/api";

const pendingAdminUsername = localStorage.getItem('skillswap_admin_pending_username');
if (pendingAdminUsername) {
  const loginUsernameInput = document.getElementById('login-username');
  if (loginUsernameInput && !loginUsernameInput.value) loginUsernameInput.value = pendingAdminUsername;
}

const defaultConfig = {
  platform_name: 'SkillSwap',
  dashboard_title: 'Admin Dashboard',
  welcome_message: 'Welcome back, Admin',
  bg_color: '#0f172a',
  surface_color: '#1e293b',
  text_color: '#e2e8f0',
  primary_color: '#6366f1',
  accent_color: '#10b981'
};

// ========== ELEMENT SDK ==========
window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    const cfg = k => config[k] || defaultConfig[k];
    const brandEls = document.querySelectorAll('#login-brand, #sidebar-brand');
    brandEls.forEach(el => { if (el) el.textContent = cfg('platform_name'); });
    const welc = document.getElementById('welcome-msg');
    if (welc) welc.textContent = cfg('welcome_message');

    document.body.style.color = cfg('text_color');

    // Apply colors to key elements
    document.querySelectorAll('.bg-indigo-600').forEach(el => el.style.backgroundColor = cfg('primary_color'));
    document.querySelectorAll('.text-emerald-400, .text-emerald-500').forEach(el => el.style.color = cfg('accent_color'));

    if (config.font_family) {
      document.body.style.fontFamily = `${config.font_family}, DM Sans, sans-serif`;
    }
    if (config.font_size) {
      const base = config.font_size;
      document.body.style.fontSize = `${base}px`;
    }
  },
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.bg_color || defaultConfig.bg_color, set: v => { config.bg_color = v; window.elementSdk.setConfig({ bg_color: v }); } },
      { get: () => config.surface_color || defaultConfig.surface_color, set: v => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
      { get: () => config.text_color || defaultConfig.text_color, set: v => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
      { get: () => config.primary_color || defaultConfig.primary_color, set: v => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
      { get: () => config.accent_color || defaultConfig.accent_color, set: v => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } }
    ],
    borderables: [],
    fontEditable: {
      get: () => config.font_family || 'DM Sans',
      set: v => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }
    },
    fontSizeable: {
      get: () => config.font_size || 14,
      set: v => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); }
    }
  }),
  mapToEditPanelValues: (config) => new Map([
    ['platform_name', config.platform_name || defaultConfig.platform_name],
    ['dashboard_title', config.dashboard_title || defaultConfig.dashboard_title],
    ['welcome_message', config.welcome_message || defaultConfig.welcome_message]
  ])
});

// ========== DATA SDK ==========
const dataHandler = {
  onDataChanged(data) {
    if (appState.backendMode) return;
    appState.allData = data;
    if (appState.loggedIn) {
      renderCurrentPage();
    }
  }
};

(async () => {
  const result = await window.dataSdk.init(dataHandler);
  if (!result.isOk) console.error('Data SDK init failed');
})();

async function loadAdminData() {
  const endpoints = [`${API_BASE}/admin/overview`, `${API_BASE}/users/overview`];
  const localUserMap = JSON.parse(localStorage.getItem('skillswap_users') || '{}');
  const localProfileKeys = Object.keys(localUserMap || {});
  const localUsers = localProfileKeys.map((key) => {
    const user = localUserMap[key] || {};
    const profile = JSON.parse(localStorage.getItem(`skillswap_profile_${key}`) || '{}');
    const connections = JSON.parse(localStorage.getItem(`skillswap_connections_${key}`) || '[]');
    return {
      __backendId: user.id ? String(user.id) : key,
      type: 'user',
      name: user.name || user.username || 'Unknown',
      email: user.email || '',
      username: user.username || key,
      role: user.role || user.profession || 'Student',
      profession: user.profession || 'Not specified',
      phone: user.phone || '',
      location: user.location || '',
      country: user.country || '',
      state: user.state || '',
      college_name: profile.collegeName || profile.college_name || '',
      college_located: profile.collegeLocated || profile.college_located || '',
      year_study: profile.yearStudy || profile.year_study || '',
      branch: profile.branch || '',
      bio_text: profile.bioText || profile.bio_text || '',
      skills: formatSkillSummary(profile.teachSkills || [], profile.learnSkills || []),
      teach_skills: extractSkillLabels(profile.teachSkills || []).map((skill) => ({ skill })),
      learn_skills: extractSkillLabels(profile.learnSkills || []).map((skill) => ({ skill })),
      verifications: profile.verifications || [],
      connections_count: connections.length,
      sessions_count: connections.length,
      notes_uploaded_count: 0,
      notes_bought_count: 0,
      consultant_profiles: [],
      verified: Boolean(profile.verified),
      status: 'active',
      trust_score: 50,
      fraud_score: 50,
      reported: false,
      report_reason: '',
      created_at: user.createdAt || new Date().toISOString(),
      badge: '',
      level: 1,
      points: 0
    };
  });

  for (const endpoint of endpoints) {
    try {
      const response = await fetch(endpoint);
      if (!response.ok) continue;
      const payload = await response.json();
      appState.backendMode = true;

      const remoteUsers = (payload.users || []).map((user) => ({
        __backendId: String(user.id),
        type: 'user',
        name: user.name,
        email: user.email,
        username: user.username,
        role: user.role,
        profession: user.profession,
        phone: user.phone,
        location: user.location,
        country: user.country,
        state: user.state,
        college_name: user.collegeName || user.college_name || '',
        college_located: user.collegeLocated || user.college_located || '',
        year_study: user.yearStudy || user.year_study || '',
        branch: user.branch || '',
        bio_text: user.bioText || user.bio_text || '',
        skills: formatSkillSummary(user.teach_skills || user.skills || [], user.learn_skills || []),
        teach_skills: extractSkillLabels(user.teach_skills || user.skills || []).map((skill) => ({ skill })),
        learn_skills: extractSkillLabels(user.learn_skills || []).map((skill) => ({ skill })),
        verifications: user.verifications || [],
        connections_count: user.connections_count || 0,
        sessions_count: user.sessions_count || 0,
        notes_uploaded_count: user.notes_uploaded_count || 0,
        notes_bought_count: user.notes_bought_count || 0,
        consultant_profiles: user.consultant_profiles || [],
        verified: Boolean(user.verified),
        status: user.status || 'active',
        trust_score: Number(user.trust_score || 0),
        fraud_score: Number(user.fraud_score || 0),
        reported: Boolean(user.reported),
        report_reason: user.report_reason || '',
        created_at: user.createdAt || user.created_at || new Date().toISOString(),
        badge: user.badge || '',
        level: Number(user.level || 1),
        points: Number(user.points || 0)
      }));

      appState.allData = [
        ...remoteUsers,
        ...(payload.sessions || []).map((item) => ({ ...item, type: 'session' })),
        ...(payload.reviews || []).map((item) => ({ ...item, type: 'review' })),
        ...(payload.notifications || []).map((item) => ({ ...item, type: 'notification' })),
        ...(payload.logs || []).map((item) => ({ ...item, type: 'log' })),
        ...localUsers.filter((localUser) => {
          const exists = remoteUsers.some((remoteUser) => {
            const a = String(remoteUser.username || '').toLowerCase();
            const b = String(localUser.username || '').toLowerCase();
            const c = String(remoteUser.email || '').toLowerCase();
            const d = String(localUser.email || '').toLowerCase();
            return (a && b && a === b) || (c && d && c === d);
          });
          return !exists;
        })
      ];
      return true;
    } catch (error) {
      console.error('Admin data load failed from', endpoint, error.message);
    }
  }

  appState.backendMode = false;
  appState.allData = [...localUsers];
  return localUsers.length > 0;
}

// Helper to get data by type
function getDataByType(type) {
  return appState.allData.filter(d => d.type === type);
}

function extractSkillLabels(value) {
  if (!value) return [];
  const items = Array.isArray(value) ? value : String(value).split(',');
  return items
    .map((item) => {
      if (item == null) return '';
      if (typeof item === 'string') return item.trim();
      if (typeof item === 'object') {
        return String(
          item.skill ||
          item.name ||
          item.title ||
          item.label ||
          item.value ||
          item.text ||
          ''
        ).trim();
      }
      return String(item).trim();
    })
    .filter(Boolean);
}

function formatSkillSummary(teachSkills, learnSkills, fallback = '—') {
  const combined = [...extractSkillLabels(teachSkills), ...extractSkillLabels(learnSkills)];
  return combined.length ? [...new Set(combined)].join(', ') : fallback;
}

// ========== AUTH ==========
function handleLogin() {
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;
  const role = document.getElementById('login-role').value;
  const errEl = document.getElementById('login-error');

  if (!username || !password) {
    errEl.textContent = 'Please fill in all fields';
    errEl.classList.remove('hidden');
    return;
  }

  appState.adminEmail = username;
  appState.adminRole = role;

  // Generate OTP
  appState.otpCode = String(Math.floor(100000 + Math.random() * 900000));

  document.getElementById('login-form').classList.add('hidden');
  document.getElementById('otp-form').classList.remove('hidden');

  // Build OTP inputs
  const otpContainer = document.getElementById('otp-inputs');
  otpContainer.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.maxLength = 1;
    inp.className = 'w-10 h-12 text-center bg-slate-800 border border-slate-700 rounded-lg text-white text-lg font-mono focus:border-indigo-500';
    inp.dataset.index = i;
    inp.addEventListener('input', (e) => {
      if (e.target.value && i < 5) otpContainer.children[i+1].focus();
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && i > 0) otpContainer.children[i-1].focus();
    });
    otpContainer.appendChild(inp);
  }
  otpContainer.children[0].focus();

  document.getElementById('otp-hint').textContent = `Demo OTP: ${appState.otpCode}`;
  errEl.classList.add('hidden');
}

function showLoginForm() {
  document.getElementById('login-form').classList.remove('hidden');
  document.getElementById('otp-form').classList.add('hidden');
}

function verifyOTP() {
  const inputs = document.querySelectorAll('#otp-inputs input');
  const entered = Array.from(inputs).map(i => i.value).join('');
  const errEl = document.getElementById('otp-error');

  if (entered === appState.otpCode) {
    appState.loggedIn = true;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('dashboard-screen').classList.remove('hidden');
    document.getElementById('admin-name').textContent = appState.adminEmail;
    document.getElementById('admin-role').textContent = appState.adminRole === 'super_admin' ? 'Super Admin' : 'Moderator';
    errEl.classList.add('hidden');
    lucide.createIcons();
    showToast('Logged in successfully', 'success');
    logAction('Admin Login', `${appState.adminEmail} logged in as ${appState.adminRole}`);
    
    loadAdminData().then(() => {
      navigateTo('overview');
      renderCurrentPage();
    });

    // Refresh live backend data every 5 seconds to sync with other pages
    setInterval(async () => {
      await loadAdminData();
      renderCurrentPage();
    }, 5000);
  } else {

// ========== FRAUD DETECTION AI ==========
function calculateFraudScore(user) {
  let score = 0;
  // Too many sessions per day (>10)
  if (user.sessions_count > 10) score += 30;
  else if (user.sessions_count > 7) score += 15;
  // Low trust score
  if (user.trust_score < 20) score += 25;
  else if (user.trust_score < 40) score += 10;
  // Reported users
  if (user.reported) score += 20;
  // No activity (suspicious if sessions_count is 0 but account exists)
  if (user.sessions_count === 0) score += 10;
  // Newly created (less than a day)
  const created = new Date(user.created_at);
  const daysSince = (Date.now() - created.getTime()) / 86400000;
  if (daysSince < 1 && user.sessions_count > 5) score += 25;
  return Math.min(score, 100);
}

async function createSession() {
  if (appState.allData.length >= 999) { showToast('Data limit reached', 'error'); return; }
  const user = document.getElementById('sess-user').value;
  const partner = document.getElementById('sess-partner').value;
  if (!user || !partner) { showToast('Select both user and partner', 'error'); return; }
  const btn = document.getElementById('create-sess-btn');
  btn.textContent = 'Creating...'; btn.disabled = true;

  const otp = generateOTP();
  const result = await window.dataSdk.create({
    type: 'session', name: user, session_partner: partner,
    session_duration: parseInt(document.getElementById('sess-duration').value) || 30,
    session_status: 'active', otp_code: otp, otp_verified: false,
    meet_link: document.getElementById('sess-link').value || '',
    created_at: new Date().toISOString(),
    email: '', role: '', trust_score: 0, fraud_score: 0, status: '',
    verified: false, skills: '', sessions_count: 0, badge: '', level: 0,
    points: 0, reported: false, report_reason: '', rating: 0,
    review_text: '', reviewer: '', flagged_spam: false,
    notification_text: '', notification_target: '', read: false,
    action: '', details: '', timestamp: ''
  });

  if (result.isOk) { closeModal(); showToast(`Session created. OTP: ${otp}`, 'success'); logAction('Created Session', `${user} ↔ ${partner}`); }
  else { showToast('Failed', 'error'); btn.textContent = 'Create'; btn.disabled = false; }
}

async function cancelSession(id) {
  const session = appState.allData.find(d => d.__backendId === id);
  if (!session) return;
  session.session_status = 'cancelled';
  const result = await window.dataSdk.update(session);
  if (result.isOk) { showToast('Session cancelled', 'warning'); logAction('Cancelled Session', session.name); }
}

}

function editGamification(id) {
  const user = appState.allData.find(d => d.__backendId === id);
  if (!user) return;
  showModal(`Edit ${user.name}'s Gamification`, `
    <div class="space-y-3">
      <div><label for="gam-badge" class="block text-xs text-slate-400 mb-1">Badge</label><select id="gam-badge" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm">
        <option value="">None</option>
        <option ${user.badge==='Champion'?'selected':''}>Champion</option>
        <option ${user.badge==='Expert'?'selected':''}>Expert</option>
        <option ${user.badge==='Rising Star'?'selected':''}>Rising Star</option>
        <option ${user.badge==='Active'?'selected':''}>Active</option>
        <option ${user.badge==='Newcomer'?'selected':''}>Newcomer</option>
      </select></div>
      <div><label for="gam-level" class="block text-xs text-slate-400 mb-1">Level</label><input id="gam-level" type="number" min="1" max="100" value="${user.level||1}" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm"></div>
      <div><label for="gam-points" class="block text-xs text-slate-400 mb-1">Points</label><input id="gam-points" type="number" min="0" value="${user.points||0}" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm"></div>
    </div>`,
    `<button onclick="closeModal()" class="px-4 py-2 text-slate-400 hover:text-white text-sm">Cancel</button>
     <button onclick="saveGamification('${id}')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-colors">Save</button>`);
}

async function saveGamification(id) {
  const user = appState.allData.find(d => d.__backendId === id);
  if (!user) return;
  user.badge = document.getElementById('gam-badge').value;
  user.level = parseInt(document.getElementById('gam-level').value) || 1;
  user.points = parseInt(document.getElementById('gam-points').value) || 0;
  await window.dataSdk.update(user);
  closeModal();
  showToast('Gamification updated', 'success');
}

function showSendNotifModal() {
  const users = getDataByType('user');
  const opts = `<option value="All Users">All Users</option>` + users.map(u => `<option value="${u.name}">${u.name}</option>`).join('');
  showModal('Send Notification', `
    <div class="space-y-3">
      <div><label for="notif-target" class="block text-xs text-slate-400 mb-1">Target</label><select id="notif-target" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm">${opts}</select></div>
      <div><label for="notif-text" class="block text-xs text-slate-400 mb-1">Message</label><textarea id="notif-text" rows="3" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white text-sm" placeholder="Enter notification message..."></textarea></div>
    </div>`,
    `<button onclick="closeModal()" class="px-4 py-2 text-slate-400 hover:text-white text-sm">Cancel</button>
     <button onclick="sendNotification()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition-colors">Send</button>`);
}

async function sendNotification() {
  if (appState.allData.length >= 999) { showToast('Data limit reached', 'error'); return; }
  const target = document.getElementById('notif-target').value;
  const text = document.getElementById('notif-text').value;
  if (!text) { showToast('Message required', 'error'); return; }
  await window.dataSdk.create({
    type: 'notification', notification_text: text, notification_target: target,
    read: false, created_at: new Date().toISOString(),
    name: '', email: '', role: '', trust_score: 0, fraud_score: 0, status: '',
    verified: false, skills: '', sessions_count: 0, badge: '', level: 0,
    points: 0, reported: false, report_reason: '', rating: 0,
    review_text: '', reviewer: '', flagged_spam: false,
    session_partner: '', session_duration: 0, session_status: '',
    otp_code: '', otp_verified: false, meet_link: '',
    action: '', details: '', timestamp: ''
  });
  closeModal();
  showToast('Notification sent', 'success');
  logAction('Sent Notification', `To: ${target}`);
}

async function deleteNotif(id) {
  const n = appState.allData.find(d => d.__backendId === id);
  if (n) await window.dataSdk.delete(n);
}

function renderAnalytics() {
  const users = getDataByType('user');
  const sessions = getDataByType('session');
  const reviews = getDataByType('review');
  const content = document.getElementById('content-area');
  content.innerHTML = `
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
      ${statCard('users', 'Users', users.length, '', 'blue')}
      ${statCard('video', 'Sessions', sessions.length, '', 'violet')}
      ${statCard('star', 'Reviews', reviews.length, '', 'emerald')}
      ${statCard('shield-alert', 'Fraud Flags', users.filter(u=>calculateFraudScore(u)>60).length, '', 'red')}
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5">
        <h3 class="text-sm font-semibold text-slate-300 mb-4">User Status Distribution</h3>
        <canvas id="chart-user-status" height="200"></canvas>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5">
        <h3 class="text-sm font-semibold text-slate-300 mb-4">Trust Score Distribution</h3>
        <canvas id="chart-trust" height="200"></canvas>
      </div>
    </div>
    <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5">
      <h3 class="text-sm font-semibold text-slate-300 mb-4">Fraud Detection Report</h3>
      <canvas id="chart-fraud" height="200"></canvas>
    </div>`;

  setTimeout(() => {
    const statusCounts = { active: 0, suspended: 0, banned: 0, warned: 0 };
    users.forEach(u => { statusCounts[u.status] = (statusCounts[u.status]||0) + 1; });

    const ctx1 = document.getElementById('chart-user-status');
    if (ctx1) {
      appState.charts.userStatus = new Chart(ctx1, {
        type: 'doughnut',
        data: {
          labels: ['Active', 'Suspended', 'Banned', 'Warned'],
          datasets: [{ data: [statusCounts.active, statusCounts.suspended, statusCounts.banned, statusCounts.warned], backgroundColor: ['#10b981','#f59e0b','#ef4444','#f97316'], borderWidth: 0 }]
        },
        options: { responsive: true, plugins: { legend: { labels: { color: '#94a3b8' } } } }
      });
    }

    const trustBuckets = [0,0,0,0,0];
    users.forEach(u => { const idx = Math.min(Math.floor(u.trust_score/20), 4); trustBuckets[idx]++; });
    const ctx2 = document.getElementById('chart-trust');
    if (ctx2) {
      appState.charts.trust = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: ['0-20','20-40','40-60','60-80','80-100'],
          datasets: [{ label: 'Users', data: trustBuckets, backgroundColor: ['#ef4444','#f97316','#f59e0b','#84cc16','#10b981'], borderRadius: 6 }]
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: '#64748b' } }, y: { grid: { color: 'rgba(148,163,184,0.08)' }, ticks: { color: '#64748b' } } } }
      });
    }

    const fraudData = users.map(u => calculateFraudScore(u)).sort((a,b) => b-a).slice(0, 20);
    const ctx3 = document.getElementById('chart-fraud');
    if (ctx3) {
      appState.charts.fraud = new Chart(ctx3, {
        type: 'line',
        data: {
          labels: fraudData.map((_,i) => `User ${i+1}`),
          datasets: [{ label: 'Fraud Score', data: fraudData, borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.1)', fill: true, tension: 0.4 }]
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: '#64748b' } }, y: { grid: { color: 'rgba(148,163,184,0.08)' }, ticks: { color: '#64748b' }, max: 100 } } }
      });
    }
  }, 100);
}

// ========== HELPERS ==========
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs/24)}d ago`;
}
