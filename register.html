<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap | Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-a: #020611;
      --bg-b: #07193f;
      --panel: rgba(8, 19, 44, 0.8);
      --border: rgba(111, 145, 234, 0.34);
      --gold: #f5cc4a;
      --text: #eaf0ff;
      --muted: #93a0c3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.2rem;
      font-family: "Outfit", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 14% 14%, #0a1f4d 0%, transparent 35%),
                  radial-gradient(circle at 82% 18%, #0c1738 0%, transparent 40%),
                  linear-gradient(140deg, var(--bg-a), var(--bg-b));
    }

    .auth-box {
      width: min(860px, 100%);
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(12px);
      padding: 2rem;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), 0 0 28px rgba(245, 204, 74, 0.2);
      animation: rise 0.8s ease;
    }

    .brand {
      margin: 0 0 0.3rem;
      font-family: "Orbitron", sans-serif;
      font-size: 1.8rem;
    }

    .brand span { color: var(--gold); }

    .sub {
      margin: 0 0 1.4rem;
      color: var(--muted);
    }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.95rem 0.95rem;
    }

    .field {
      display: grid;
      gap: 0.35rem;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 0.9rem;
      color: #b8c5e5;
    }

    input,
    select {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(135, 167, 251, 0.25);
      background: rgba(8, 19, 44, 0.8);
      color: var(--text);
      padding: 0.75rem 0.9rem;
      font-size: 0.97rem;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    input:focus,
    select:focus {
      border-color: rgba(245, 204, 74, 0.8);
      box-shadow: 0 0 0 3px rgba(245, 204, 74, 0.18);
    }

    .btn {
      margin-top: 0.35rem;
      border: 0;
      border-radius: 12px;
      padding: 0.82rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: #07122e;
      background: linear-gradient(135deg, #ffe17d, #ffc516);
      box-shadow: 0 0 24px rgba(245, 204, 74, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(245, 204, 74, 0.35);
    }

    .links {
      display: flex;
      justify-content: space-between;
      margin-top: 1rem;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    a {
      color: #d4dcf8;
      text-decoration: none;
      font-size: 0.92rem;
    }

    a:hover { color: var(--gold); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .auth-box { padding: 1.25rem; }
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="auth-box" aria-labelledby="register-title">
    <h1 class="brand" id="register-title">Skill<span>Swap</span></h1>
    <p class="sub">Create your profile and start swapping skills with learners worldwide.</p>

    <form id="registerForm">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your full name" required />
      </div>

      <div class="field">
        <label for="email">Email (Gmail)</label>
        <input id="email" name="email" type="email" pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$" placeholder="you@gmail.com" required />
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" placeholder="Enter phone number" required />
      </div>

      <div class="field">
        <label for="profession">Profession</label>
        <select id="profession" name="profession" required>
          <option value="" disabled selected>Select profession</option>
          <option>Student</option>
          <option>Professor</option>
          <option>Teacher</option>
          <option>Freelancer</option>
          <option>Admin</option>
          <option>Consultant</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label for="location">Location</label>
        <input id="location" name="location" type="text" placeholder="City / Area" required />
      </div>

      <div class="field">
        <label for="country">Country</label>
        <input id="country" name="country" type="text" placeholder="Country" required />
      </div>

      <div class="field">
        <label for="state">State</label>
        <input id="state" name="state" type="text" placeholder="State" required />
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Choose a username" required />
      </div>

      <div class="field full">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Create password" required />
      </div>

      <div class="field full">
        <button class="btn" type="submit">Register</button>
      </div>
    </form>

    <div class="links">
      <a href="index.html">Back to Home</a>
      <a href="login.html">Already have an account?</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </section>

  <script>
    const registerForm = document.getElementById('registerForm');
    const logoutLink = document.getElementById('logoutLink');
    const API_BASE = 'http://localhost:4000/api';

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const isNetworkError = (error) => Boolean(
      error && (
        error.name === 'TypeError' ||
        /Failed to fetch|NetworkError|ERR_CONNECTION_REFUSED|ECONNREFUSED/i.test(error.message || '')
      )
    );

    async function fetchWithRetry(url, options = {}, retries = 2, delayMs = 350) {
      let lastError = null;
      for (let attempt = 0; attempt <= retries; attempt += 1) {
        try {
          return await fetch(url, options);
        } catch (error) {
          lastError = error;
          if (attempt < retries && isNetworkError(error)) {
            await sleep(delayMs * (attempt + 1));
            continue;
          }
          throw error;
        }
      }
      throw lastError || new Error('Request failed');
    }

    registerForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value.trim();
      const usernameRaw = document.getElementById('username').value.trim();
      const usernameKey = usernameRaw.toLowerCase();
      if (!usernameKey) {
        alert('Please enter a username.');
        return;
      }

      const payload = {
        name,
        email,
        username: usernameRaw,
        password,
        role: document.getElementById('profession').value,
        phone: document.getElementById('phone').value.trim(),
        profession: document.getElementById('profession').value,
        location: document.getElementById('location').value.trim(),
        country: document.getElementById('country').value.trim(),
        state: document.getElementById('state').value.trim()
      };

      fetchWithRetry(`${API_BASE}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
          .then(async (res) => {
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.message || 'Registration failed');
            localStorage.setItem('skillswap_registered_user', usernameRaw);
            if (email) localStorage.setItem('skillswap_registered_email', email);
            if (String(payload.role).toLowerCase() === 'admin') {
              localStorage.setItem('skillswap_admin_pending_username', usernameRaw);
              localStorage.setItem('skillswap_admin_pending_role', 'admin');
              window.location.href = 'adminprof.html';
            } else {
              window.location.href = 'login.html';
            }
          })
        .catch((error) => {
          alert(`${error.message || 'Registration failed'}.\n\nThe user was not saved to MySQL, so please retry after confirming the backend is running.`);
        });
    });

    logoutLink.addEventListener('click', (event) => {
      event.preventDefault();
      localStorage.removeItem('skillswap_current_user');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
