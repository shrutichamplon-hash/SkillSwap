<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillSwap | AI Matching</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app-layout.css" />
  <style>
    .filter-row { margin-top: .7rem; display: grid; grid-template-columns: 1fr 220px; gap: .6rem; }
    .match-card-top { display: flex; justify-content: space-between; gap: .6rem; align-items: center; }
    .rating { color: #ffd76a; font-weight: 700; }
    .skill-wrap { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem; }
    .skill-chip { border:1px solid rgba(129,166,250,.42); background:rgba(129,166,250,.14); border-radius:999px; padding:.18rem .48rem; font-size:.76rem; }
    .connected { background: rgba(113,212,159,0.18) !important; color:#b8ffd9 !important; border:1px solid rgba(113,212,159,.5) !important; }
    @media (max-width: 980px) { .filter-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand" href="index.html">Skill<span>Swap</span></a>
      <section class="user-card">
        <p class="user-label">USERNAME</p>
        <p class="user-name" id="sidebarName">user</p>
        <p class="user-meta" id="sidebarMeta">Branch | Year</p>
      </section>
      <nav class="nav">
        <a href="dash.html" data-page="dash">Dashboard</a>
        <a href="connection.html" data-page="connections">Connections</a>
        <a href="meetings.html" data-page="meetings">Meetings</a>
        <a href="Ai_match.html" data-page="ai">AI Matching</a>
        <a href="creds_batch.html" data-page="credits">Credits & Badges</a>
        <a href="leaderboard.html" data-page="leaderboard">Leaderboard</a>
        <a href="notes.html" data-page="notes">Notes Market</a>
        <a href="consult.html" data-page="consult">Hire Consultant</a>
        <a href="profile.html" data-page="profile">Edit Profile</a>
      </nav>
      <div class="spacer"></div>
      <button id="logoutBtn" class="btn btn-gold" type="button">Logout</button>
    </aside>

    <main class="main-area">
      <section class="topbar">
        <input id="topSearch" class="search" type="search" placeholder="Search by skill or name..." />
        <div class="top-chip">Notifications: 3</div>
        <div id="topProfileName" class="top-chip">Profile</div>
      </section>

      <section class="panel hero">
        <h1>AI Matching</h1>
        <p>Scoring formula: Skills 50% + Interests 30% + Activity 20%.</p>
      </section>

      <section class="panel">
        <div class="row-3">
          <input id="skillsInput" class="input" placeholder="Skills (comma-separated)" />
          <input id="interestInput" class="input" placeholder="Interests (comma-separated)" />
          <input id="goalInput" class="input" placeholder="Goals (comma-separated)" />
        </div>
        <div class="filter-row">
          <select id="branchFilter" class="select">
            <option value="">All Branches</option>
            <option>CSE</option>
            <option>IT</option>
            <option>AI & DS</option>
            <option>ECE</option>
            <option>Mechanical</option>
          </select>
          <button id="runMatch" class="btn btn-gold" type="button">Run Smart Match</button>
        </div>
      </section>

      <section class="panel">
        <h2 style="margin:0 0 .45rem;font-family:Sora,sans-serif;">Suggested Matches</h2>
        <div id="matchGrid" class="grid"></div>
      </section>
    </main>
  </div>
  <div id="toastWrap" class="toast-wrap"></div>

  <script src="app-layout.js"></script>
  <script>
    const user = SkillSwapApp.requireAuth();
    if (!user) throw new Error("Auth required");
    SkillSwapApp.setShell(user, "ai");

    const people = [
      { id: 201, name: "Riya Nair", branch: "AI & DS", year: "4th Year", skills: ["python", "ml", "nlp", "dbms"], interests: ["ai", "analytics", "research"], activity: 92, rating: 4.8, profession: "ML Enthusiast", photo: "https://i.pravatar.cc/120?img=32" },
      { id: 202, name: "Aarav Mehta", branch: "CSE", year: "3rd Year", skills: ["react", "javascript", "ui", "dbms"], interests: ["web", "product", "startup"], activity: 84, rating: 4.9, profession: "Frontend Mentor", photo: "https://i.pravatar.cc/120?img=12" },
      { id: 203, name: "Sneha Iyer", branch: "IT", year: "2nd Year", skills: ["dsa", "c++", "os", "dbms"], interests: ["coding", "interviews", "problem solving"], activity: 78, rating: 4.7, profession: "DSA Coach", photo: "https://i.pravatar.cc/120?img=5" },
      { id: 204, name: "Aditya Rao", branch: "ECE", year: "4th Year", skills: ["iot", "embedded", "c", "signals"], interests: ["hardware", "robotics", "core"], activity: 70, rating: 4.5, profession: "Embedded Mentor", photo: "https://i.pravatar.cc/120?img=18" },
      { id: 205, name: "Karan Verma", branch: "Mechanical", year: "3rd Year", skills: ["matlab", "cad", "thermo"], interests: ["design", "simulation"], activity: 66, rating: 4.6, profession: "Mechanical Tutor", photo: "https://i.pravatar.cc/120?img=21" }
    ];

    const matchGrid = document.getElementById("matchGrid");

    function toast(message, ok = true) {
      const wrap = document.getElementById("toastWrap");
      const el = document.createElement("div");
      el.className = `toast ${ok ? "ok" : ""}`;
      el.textContent = message;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }

    function tokenize(value) {
      return value.split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
    }

    function overlapRatio(base, target) {
      if (!base.length) return { ratio: 0, overlap: [] };
      const overlap = base.filter((x) => target.includes(x));
      return { ratio: overlap.length / base.length, overlap };
    }

    function scoreMatch(person, inputSkills, inputInterests) {
      const skill = overlapRatio(inputSkills, person.skills);
      const interest = overlapRatio(inputInterests, person.interests);
      const activity = Math.min(1, Math.max(0, person.activity / 100));

      const pct = Math.round(skill.ratio * 50 + interest.ratio * 30 + activity * 20);
      return { pct, skill, interest };
    }

    function stars(rating) {
      const full = Math.round(rating);
      return "\u2605".repeat(full) + "\u2606".repeat(Math.max(0, 5 - full));
    }

    function showSkeletons() {
      matchGrid.innerHTML = Array.from({ length: 4 }).map(() => '<div class="skeleton"></div>').join("");
    }

    function renderMatches(items) {
      if (!items.length) {
        matchGrid.innerHTML = '<p class="muted">No matches found for these filters.</p>';
        return;
      }

      matchGrid.innerHTML = items.map((item, idx) => `
        <article class="card" style="animation-delay:${Math.min(idx * 0.05, .25)}s;">
          <div class="match-card-top">
            <div>
              <h3>${item.name}</h3>
              <p class="muted" style="margin:.2rem 0;">${item.profession} | ${item.branch} ${item.year}</p>
            </div>
            <div class="rating">${stars(item.rating)} ${item.rating.toFixed(1)}</div>
          </div>
          <p style="margin:.35rem 0;">Match: <strong>${item.match.pct}%</strong></p>
          <div class="progress"><span style="width:${item.match.pct}%;"></span></div>
          <div class="skill-wrap">${item.skills.map((s) => `<span class="skill-chip">${s}</span>`).join("")}</div>
          <p class="muted" style="margin:.35rem 0;">Skill overlap: ${item.match.skill.overlap.join(", ") || "None"}</p>
          <div style="margin-top:.5rem;display:flex;gap:.5rem;align-items:center;">
            <button class="btn btn-gold" data-connect="${item.id}" type="button">Connect</button>
          </div>
        </article>
      `).join("");

      matchGrid.querySelectorAll("button[data-connect]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const targetId = Number(btn.getAttribute("data-connect"));
          const selected = people.find((p) => p.id === targetId);
          try {
            if (!user.id) throw new Error("no user id");
            await SkillSwapApp.api("/connections", {
              method: "POST",
              body: JSON.stringify({ userId: user.id, connectedUserId: targetId })
            });
          } catch {
            const key = `skillswap_connections_${String(user.username || "user").toLowerCase()}`;
            const existing = SkillSwapApp.parseJSON(localStorage.getItem(key), []);
            if (!existing.includes(String(targetId))) {
              existing.push(String(targetId));
              localStorage.setItem(key, JSON.stringify(existing));
            }
          }

          btn.innerHTML = "Connected";
          btn.classList.add("connected");
          btn.disabled = true;
          toast("Connection successful");

          if (selected) {
            localStorage.setItem("skillswap_selected_user", JSON.stringify({
              id: selected.id,
              name: selected.name,
              photo: selected.photo,
              profession: selected.profession,
              branch: selected.branch,
              yearStudy: selected.year,
              location: "India",
              rating: selected.rating,
              teaches: selected.skills,
              wants: selected.interests,
              availability: "Weekdays 7 PM - 10 PM",
              bio: `${selected.name} can help with ${selected.skills.slice(0, 2).join(" and ")}.`,
              links: [{ label: "GitHub", url: "https://github.com/" }]
            }));
            setTimeout(() => {
              window.location.href = `view-profile.html?id=${encodeURIComponent(String(selected.id))}`;
            }, 700);
          }
        });
      });
    }

    function runSmartMatch() {
      showSkeletons();
      const inputSkills = tokenize(document.getElementById("skillsInput").value);
      const inputInterests = tokenize(document.getElementById("interestInput").value);
      const branchFilter = document.getElementById("branchFilter").value;

      setTimeout(() => {
        let list = people.slice();
        if (branchFilter) list = list.filter((p) => p.branch === branchFilter);

        const ranked = list
          .map((p) => ({ ...p, match: scoreMatch(p, inputSkills, inputInterests) }))
          .sort((a, b) => b.match.pct - a.match.pct);

        renderMatches(ranked);
      }, 700);
    }

    document.getElementById("runMatch").addEventListener("click", runSmartMatch);

    document.addEventListener("skillswap-search", (event) => {
      const keyword = event.detail;
      const filtered = people.filter((p) => !keyword || p.name.toLowerCase().includes(keyword) || p.skills.join(" ").includes(keyword));
      renderMatches(filtered.map((p) => ({ ...p, match: { pct: 60, skill: { overlap: [] } } })));
    });

    runSmartMatch();
  </script>
</body>
</html>
